name: Release Fonts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build fonts (Extended + Text)
        run: |
          uv run planetaire build download
          uv run planetaire build planetaire-mono
          uv run planetaire build text

      - name: Validate fonts
        run: |
          uv run planetaire validate fonts/output/PlanetaireMonoExtended-*.ttf
          uv run planetaire validate fonts/output/PlanetaireMonoText-*.ttf

      - name: Package release archives
        run: |
          cd fonts/output
          # Extended: the full build with all Nerd Font icons (TTF).
          tar -cJf ../../PlanetaireMono-Extended.tar.xz PlanetaireMonoExtended-*.ttf
          zip ../../PlanetaireMono-Extended.zip PlanetaireMonoExtended-*.ttf
          # Text: lightweight web/regular build (TTF + WOFF2 + WOFF + @font-face CSS).
          tar -cJf ../../PlanetaireMono-Text.tar.xz \
            PlanetaireMonoText-*.ttf PlanetaireMonoText-*.woff2 \
            PlanetaireMonoText-*.woff planetaire-mono-text.css
          zip ../../PlanetaireMono-Text.zip \
            PlanetaireMonoText-*.ttf PlanetaireMonoText-*.woff2 \
            PlanetaireMonoText-*.woff planetaire-mono-text.css
          cd ../..
          # Generate checksums for every artifact.
          sha256sum \
            PlanetaireMono-Extended.tar.xz PlanetaireMono-Extended.zip \
            PlanetaireMono-Text.tar.xz PlanetaireMono-Text.zip > SHA256SUMS

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            PlanetaireMono-Extended.tar.xz \
            PlanetaireMono-Extended.zip \
            PlanetaireMono-Text.tar.xz \
            PlanetaireMono-Text.zip \
            SHA256SUMS
