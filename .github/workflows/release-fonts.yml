name: Release Fonts

# Tag-driven release. Pushing a version tag (vX.Y.Z) is the single trigger and the
# single source of truth for the version: uv-dynamic-versioning derives the package and
# font version from the tag. This workflow builds both families, then creates the GitHub
# Release for the tag and uploads the archives. A manual run (workflow_dispatch) can
# rebuild and re-upload assets for an existing tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 so uv-dynamic-versioning can read the tag history.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag name
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build fonts (Extended + Text)
        run: |
          uv run planetaire build download
          uv run planetaire build planetaire-mono
          uv run planetaire build text --formats ttf
          uv run planetaire build text --split --italics

      - name: Validate fonts
        run: |
          uv run planetaire validate fonts/output/PlanetaireMonoExtended-*.ttf
          uv run planetaire validate fonts/output/PlanetaireMonoText-*.ttf

      - name: Package release archives
        run: |
          out=fonts/output
          # Stage each family into ttf/ and web/ subfolders with a README, then archive.
          # Both families ship TTF for local use plus WOFF2/CSS for the web; Text web
          # output is split to the slim Regular/Bold Latin, Greek, and Cyrillic profile.
          # Extended adds the full Nerd Font icon set, so it is a superset of Text.
          # Archive names stay unversioned so the releases/latest/download/... URLs
          # remain stable.
          mkdir -p dist/Extended/ttf dist/Extended/web dist/Extended/licenses \
                   dist/Text/ttf dist/Text/web dist/Text/licenses
          cp "$out"/PlanetaireMonoExtended-*.ttf dist/Extended/ttf/
          cp "$out"/PlanetaireMonoExtended-*.woff2 \
             "$out"/planetaire-mono-extended.css dist/Extended/web/
          cp docs/release/readme-extended.txt dist/Extended/README.txt
          cp LICENSE dist/Extended/LICENSE
          cp fonts/source/licenses/* dist/Extended/licenses/
          cp "$out"/PlanetaireMonoText-*.ttf dist/Text/ttf/
          cp "$out"/PlanetaireMonoText-*.woff2 \
             "$out"/planetaire-mono-text*.css dist/Text/web/
          cp docs/release/readme-text.txt dist/Text/README.txt
          cp LICENSE dist/Text/LICENSE
          cp fonts/source/licenses/* dist/Text/licenses/

          tar -cJf PlanetaireMono-Extended.tar.xz -C dist/Extended ttf web README.txt LICENSE licenses
          tar -cJf PlanetaireMono-Text.tar.xz -C dist/Text ttf web README.txt LICENSE licenses
          ( cd dist/Extended && zip -qr "$GITHUB_WORKSPACE/PlanetaireMono-Extended.zip" ttf web README.txt LICENSE licenses )
          ( cd dist/Text && zip -qr "$GITHUB_WORKSPACE/PlanetaireMono-Text.zip" ttf web README.txt LICENSE licenses )

          # Generate checksums for every artifact.
          sha256sum \
            PlanetaireMono-Extended.tar.xz PlanetaireMono-Extended.zip \
            PlanetaireMono-Text.tar.xz PlanetaireMono-Text.zip > SHA256SUMS

      - name: Create or update the GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          assets=(
            PlanetaireMono-Extended.tar.xz
            PlanetaireMono-Extended.zip
            PlanetaireMono-Text.tar.xz
            PlanetaireMono-Text.zip
            SHA256SUMS
          )
          # Require curated, version-controlled release notes for this tag so the
          # GitHub downloads page always explains the packages and links back to
          # the repo/install docs.
          notes_file="docs/release/notes/${TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing curated release notes at $notes_file. Copy docs/release/notes/TEMPLATE.md, fill it in, commit it, and rerun this workflow."
            exit 1
          fi
          echo "Using curated release notes from $notes_file."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and uploading assets (clobber)."
            gh release edit "$TAG" --notes-file "$notes_file"
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            echo "Creating release $TAG."
            gh release create "$TAG" \
              --title "Planetaire Mono $TAG" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${assets[@]}"
          fi
