name: Release Fonts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build fonts
        run: |
          uv run planetaire build download
          uv run planetaire build planetaire-mono

      - name: Validate fonts
        run: uv run planetaire validate fonts/output/*.ttf

      - name: Package release archives
        run: |
          cd fonts/output
          # Create archives with all variants
          tar -cJf ../../PlanetaireMono.tar.xz *.ttf
          zip ../../PlanetaireMono.zip *.ttf
          cd ../..
          # Generate checksums
          sha256sum PlanetaireMono.tar.xz PlanetaireMono.zip > SHA256SUMS

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            PlanetaireMono.tar.xz \
            PlanetaireMono.zip \
            SHA256SUMS
