# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v7
        with:
          # Update this as needed:
          version: "0.10.2"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      # Alternately can use the official Python action:
      # - name: Set up Python (using actions/setup-python)
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --all-extras

      - name: Set up Node.js for static site checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install static site tooling
        run: npm ci

      - name: Run linting
        run: uv run python devtools/lint.py --check

      - name: Run tests
        run: uv run pytest

  # Build, validate, and regression-check the actual font artifacts.
  # The intermediate weights are vendored under fonts/source, so this needs
  # neither FontForge nor Typst.
  fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build fonts (Extended + Text)
        run: |
          uv run planetaire build planetaire-mono
          uv run planetaire build text --formats ttf
          uv run planetaire build text --split --italics

      - name: Validate fonts
        run: |
          uv run planetaire validate fonts/output/PlanetaireMonoExtended-*.ttf
          uv run planetaire validate fonts/output/PlanetaireMonoText-*.ttf
          # Also gate the WOFF2 that actually ship: the Extended/Text web fonts and
          # the split subset slices the README tells users to deploy.
          uv run planetaire validate fonts/output/*.woff2
          # And the committed public web fonts jsDelivr serves from fonts/web/.
          uv run planetaire validate fonts/web/*.woff2

      - name: Regression check against golden manifest
        run: uv run planetaire regression verify

      # The build is byte-reproducible (`head.modified` is pinned in ops/subset.py), so
      # the committed public web fonts — what jsDelivr serves — must equal a rebuild
      # from the sources in this commit.
      - name: Check committed fonts/web matches a rebuild
        run: |
          set -euo pipefail
          # fonts/web holds the full-coverage Text build at its DEFAULT formats
          # (woff2 + ttf) — not --formats ttf and not the --split slices. Build into a
          # scratch directory so the split slices already in fonts/output cannot leak
          # in through the globs below.
          rm -rf "$RUNNER_TEMP/web-check"
          uv run planetaire build text --output-dir "$RUNNER_TEMP/web-check"
          # Same file set and globs as sync_web_font_dir() in scripts/release.py.
          rm -f fonts/web/PlanetaireMonoText-*.woff2 fonts/web/planetaire-mono-text*.css
          cp "$RUNNER_TEMP"/web-check/PlanetaireMonoText-*.woff2 fonts/web/
          cp "$RUNNER_TEMP"/web-check/planetaire-mono-text*.css fonts/web/
          git --no-pager diff --stat -- fonts/web/
          # --exit-code covers modified/deleted tracked files; porcelain also catches
          # a rebuild that adds a file fonts/web/ does not have committed.
          git diff --exit-code --quiet -- fonts/web/ && test -z "$(git status --porcelain -- fonts/web/)" || {
            echo "::error::fonts/web/ does not match a rebuild from the sources in this commit. Rebuild it and commit the result: uv run planetaire build text, then copy fonts/output/PlanetaireMonoText-*.woff2 and fonts/output/planetaire-mono-text*.css into fonts/web/ (this is what sync_web_font_dir() in scripts/release.py does) and commit fonts/web/."
            exit 1
          }
