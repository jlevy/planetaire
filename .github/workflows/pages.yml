name: Deploy site to GitHub Pages

# Publishes the static site in site/ to GitHub Pages. The site is committed
# source (not generated); see docs/website.runbook.md.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".htmlvalidate.json"
      - ".github/workflows/pages.yml"
      - ".npmrc"
      - "biome.json"
      - "devtools/site-*.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: # Allow manual deploys from the Actions tab.

# Least privilege needed to deploy Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6

      - name: Set up Node.js for static site checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install static site tooling
        run: npm ci

      - name: Validate static site
        run: npm run site:lint

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
