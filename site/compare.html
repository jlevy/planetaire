<script>
(function () {
  var themeVars = {
    light: {
      "--ink": "#000",
      "--gray": "#6e7781",
      "--rule": "#d7dbdf",
      "--surface": "#fff",
      "--bg": "#fff",
      "--hover-bg": "#e8eaed",
      "--syn-comment": "var(--l-comment)",
      "--syn-kw": "var(--l-magenta)",
      "--syn-type": "var(--l-cyan)",
      "--syn-string": "var(--l-green)",
      "--syn-num": "var(--l-cyan)",
      "--syn-yellow": "var(--l-yellow)",
      "--syn-blue": "var(--l-blue)",
      "--syn-green": "var(--l-green)",
      "--syn-dim": "var(--l-muted)"
    },
    dark: {
      "--ink": "#e6edf3",
      "--gray": "#8b949e",
      "--rule": "#30363d",
      "--surface": "#000",
      "--bg": "#000",
      "--hover-bg": "#262c36",
      "--syn-comment": "var(--d-comment)",
      "--syn-kw": "var(--d-magenta)",
      "--syn-type": "var(--d-cyan)",
      "--syn-string": "var(--d-green)",
      "--syn-num": "var(--d-cyan)",
      "--syn-yellow": "var(--d-yellow)",
      "--syn-blue": "var(--d-blue)",
      "--syn-green": "var(--d-green)",
      "--syn-dim": "var(--d-brightblack)"
    }
  };
  window.applyCompareThemeVars = function (theme) {
    var vars = themeVars[theme] || themeVars.light;
    for (var key in vars) document.documentElement.style.setProperty(key, vars[key]);
  };
  var m = document.cookie.match(/(?:^|;\s*)plt-theme=(light|dark)/);
  var theme = m && m[1];
  if (!theme) { try { theme = localStorage.getItem('plt-theme'); } catch (e) {} }
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  window.applyCompareThemeVars(theme);
})();
</script>

(function () {
  const opts = document.querySelectorAll('.ts-opt');
  if (!opts.length) return;
  const apply = (theme) => {
    document.documentElement.setAttribute('data-theme', theme);
    if (window.applyCompareThemeVars) window.applyCompareThemeVars(theme);
    try { document.cookie = 'plt-theme=' + theme + '; path=/; max-age=31536000; SameSite=Lax'; } catch (e) {}
    try { localStorage.setItem('plt-theme', theme); } catch (e) {}
    opts.forEach(o => o.setAttribute('aria-pressed', String(o.dataset.themeSet === theme)));
  };
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  opts.forEach(o => o.setAttribute('aria-pressed', String(o.dataset.themeSet === current)));
  opts.forEach(o => o.addEventListener('click', () => apply(o.dataset.themeSet)));
})();
</script>

"""
The most atomic way to train and run inference for a GPT in pure, dependency-free Python.
This file is the complete algorithm.
Everything else is just efficiency.

@karpathy
"""

import os       # os.path.exists
import math     # math.log, math.exp
import random   # random.seed, random.choices, random.gauss, random.shuffle
random.seed(42) # Let there be order among chaos

# Let there be a Dataset `docs`: list[str] of documents (e.g. a list of names)
if not os.path.exists('input.txt'):
    import urllib.request
    names_url = 'https://raw.githubusercontent.com/karpathy/makemore/988aa59/names.txt'
    urllib.request.urlretrieve(names_url, 'input.txt')
docs = [line.strip() for line in open('input.txt') if line.strip()]
random.shuffle(docs)
print(f"num docs: {len(docs)}")

# Let there be a Tokenizer to translate strings to sequences of integers ("tokens") and back
uchars = sorted(set(''.join(docs))) # unique characters in the dataset become token ids 0..n-1
BOS = len(uchars) # token id for a special Beginning of Sequence (BOS) token
vocab_size = len(uchars) + 1 # total number of unique tokens, +1 is for BOS
print(f"vocab size: {vocab_size}")

# Let there be Autograd to recursively apply the chain rule through a computation graph
class Value:
    __slots__ = ('data', 'grad', '_children', '_local_grads') # Python optimization for memory usage

    def __init__(self, data, children=(), local_grads=()):
        self.data = data                # scalar value of this node calculated during forward pass
        self.grad = 0                   # derivative of the loss w.r.t. this node, calculated in backward pass
        self._children = children       # children of this node in the computation graph
        self._local_grads = local_grads # local derivative of this node w.r.t. its children

    def __add__(self, other):
        other = other if isinstance(other, Value) else Value(other)
        return Value(self.data + other.data, (self, other), (1, 1))

    def __mul__(self, other):
        other = other if isinstance(other, Value) else Value(other)
        return Value(self.data * other.data, (self, other), (other.data, self.data))

    def __pow__(self, other): return Value(self.data**other, (self,), (other * self.data**(other-1),))
    def log(self): return Value(math.log(self.data), (self,), (1/self.data,))
    def exp(self): return Value(math.exp(self.data), (self,), (math.exp(self.data),))
    def relu(self): return Value(max(0, self.data), (self,), (float(self.data > 0),))
    def __neg__(self): return self * -1
    def __radd__(self, other): return self + other
    def __sub__(self, other): return self + (-other)
    def __rsub__(self, other): return other + (-self)
    def __rmul__(self, other): return self * other
    def __truediv__(self, other): return self * other**-1
    def __rtruediv__(self, other): return other * self**-1

    def backward(self):
        topo = []
        visited = set()
        def build_topo(v):
            if v not in visited:
                visited.add(v)
                for child in v._children:
                    build_topo(child)
                topo.append(v)
        build_topo(self)
        self.grad = 1
        for v in reversed(topo):
            for child, local_grad in zip(v._children, v._local_grads):
                child.grad += local_grad * v.grad

# Initialize the parameters, to store the knowledge of the model
n_layer = 1     # depth of the transformer neural network (number of layers)
n_embd = 16     # width of the network (embedding dimension)
block_size = 16 # maximum context length of the attention window (note: the longest name is 15 characters)
n_head = 4      # number of attention heads
head_dim = n_embd // n_head # derived dimension of each head
matrix = lambda nout, nin, std=0.08: [[Value(random.gauss(0, std)) for _ in range(nin)] for _ in range(nout)]
state_dict = {'wte': matrix(vocab_size, n_embd), 'wpe': matrix(block_size, n_embd), 'lm_head': matrix(vocab_size, n_embd)}
for i in range(n_layer):
    state_dict[f'layer{i}.attn_wq'] = matrix(n_embd, n_embd)
    state_dict[f'layer{i}.attn_wk'] = matrix(n_embd, n_embd)
    state_dict[f'layer{i}.attn_wv'] = matrix(n_embd, n_embd)
    state_dict[f'layer{i}.attn_wo'] = matrix(n_embd, n_embd)
    state_dict[f'layer{i}.mlp_fc1'] = matrix(4 * n_embd, n_embd)
    state_dict[f'layer{i}.mlp_fc2'] = matrix(n_embd, 4 * n_embd)
params = [p for mat in state_dict.values() for row in mat for p in row] # flatten params into a single list[Value]
print(f"num params: {len(params)}")

# Define the model architecture: a function mapping tokens and parameters to logits over what comes next
# Follow GPT-2, blessed among the GPTs, with minor differences: layernorm -> rmsnorm, no biases, GeLU -> ReLU
def linear(x, w):
    return [sum(wi * xi for wi, xi in zip(wo, x)) for wo in w]

def softmax(logits):
    max_val = max(val.data for val in logits)
    exps = [(val - max_val).exp() for val in logits]
    total = sum(exps)
    return [e / total for e in exps]

def rmsnorm(x):
    ms = sum(xi * xi for xi in x) / len(x)
    scale = (ms + 1e-5) ** -0.5
    return [xi * scale for xi in x]

def gpt(token_id, pos_id, keys, values):
    tok_emb = state_dict['wte'][token_id] # token embedding
    pos_emb = state_dict['wpe'][pos_id] # position embedding
    x = [t + p for t, p in zip(tok_emb, pos_emb)] # joint token and position embedding
    x = rmsnorm(x) # note: not redundant due to backward pass via the residual connection

    for li in range(n_layer):
        # 1) Multi-head Attention block
        x_residual = x
        x = rmsnorm(x)
        q = linear(x, state_dict[f'layer{li}.attn_wq'])
        k = linear(x, state_dict[f'layer{li}.attn_wk'])
        v = linear(x, state_dict[f'layer{li}.attn_wv'])
        keys[li].append(k)
        values[li].append(v)
        x_attn = []
        for h in range(n_head):
            hs = h * head_dim
            q_h = q[hs:hs+head_dim]
            k_h = [ki[hs:hs+head_dim] for ki in keys[li]]
            v_h = [vi[hs:hs+head_dim] for vi in values[li]]
            attn_logits = [sum(q_h[j] * k_h[t][j] for j in range(head_dim)) / head_dim**0.5 for t in range(len(k_h))]
            attn_weights = softmax(attn_logits)
            head_out = [sum(attn_weights[t] * v_h[t][j] for t in range(len(v_h))) for j in range(head_dim)]
            x_attn.extend(head_out)
        x = linear(x_attn, state_dict[f'layer{li}.attn_wo'])
        x = [a + b for a, b in zip(x, x_residual)]
        # 2) MLP block
        x_residual = x
        x = rmsnorm(x)
        x = linear(x, state_dict[f'layer{li}.mlp_fc1'])
        x = [xi.relu() for xi in x]
        x = linear(x, state_dict[f'layer{li}.mlp_fc2'])
        x = [a + b for a, b in zip(x, x_residual)]

    logits = linear(x, state_dict['lm_head'])
    return logits

# Let there be Adam, the blessed optimizer and its buffers
learning_rate, beta1, beta2, eps_adam = 0.01, 0.85, 0.99, 1e-8
m = [0.0] * len(params) # first moment buffer
v = [0.0] * len(params) # second moment buffer

# Repeat in sequence
num_steps = 1000 # number of training steps
for step in range(num_steps):

    # Take single document, tokenize it, surround it with BOS special token on both sides
    doc = docs[step % len(docs)]
    tokens = [BOS] + [uchars.index(ch) for ch in doc] + [BOS]
    n = min(block_size, len(tokens) - 1)

    # Forward the token sequence through the model, building up the computation graph all the way to the loss
    keys, values = [[] for _ in range(n_layer)], [[] for _ in range(n_layer)]
    losses = []
    for pos_id in range(n):
        token_id, target_id = tokens[pos_id], tokens[pos_id + 1]
        logits = gpt(token_id, pos_id, keys, values)
        probs = softmax(logits)
        loss_t = -probs[target_id].log()
        losses.append(loss_t)
    loss = (1 / n) * sum(losses) # final average loss over the document sequence. May yours be low.

    # Backward the loss, calculating the gradients with respect to all model parameters
    loss.backward()

    # Adam optimizer update: update the model parameters based on the corresponding gradients
    lr_t = learning_rate * (1 - step / num_steps) # linear learning rate decay
    for i, p in enumerate(params):
        m[i] = beta1 * m[i] + (1 - beta1) * p.grad
        v[i] = beta2 * v[i] + (1 - beta2) * p.grad ** 2
        m_hat = m[i] / (1 - beta1 ** (step + 1))
        v_hat = v[i] / (1 - beta2 ** (step + 1))
        p.data -= lr_t * m_hat / (v_hat ** 0.5 + eps_adam)
        p.grad = 0

    print(f"step {step+1:4d} / {num_steps:4d} | loss {loss.data:.4f}", end='\r')

# Inference: may the model babble back to us
temperature = 0.5 # in (0, 1], control the "creativity" of generated text, low to high
print("\n--- inference (new, hallucinated names) ---")
for sample_idx in range(20):
    keys, values = [[] for _ in range(n_layer)], [[] for _ in range(n_layer)]
    token_id = BOS
    sample = []
    for pos_id in range(block_size):
        logits = gpt(token_id, pos_id, keys, values)
        probs = softmax([l / temperature for l in logits])
        token_id = random.choices(range(vocab_size), weights=[p.data for p in probs])[0]
        if token_id == BOS:
            break
        sample.append(uchars[token_id])
    print(f"sample {sample_idx+1:2d}: {''.join(sample)}")
</script>
<script type="text/plain" id="turing-full-source">
ALAN TURING · “COMPUTING MACHINERY AND INTELLIGENCE” (1950)

1. The Imitation Game

I propose to consider the question, “Can machines think?” This should begin with
definitions of the meaning of the terms “machine” and “think.” The definitions
might be framed so as to reflect so far as possible the normal use of the words,
but this attitude is dangerous. If the meaning of the words “machine” and
“think” are to be found by examining how they are commonly used it is difficult
to escape the conclusion that the meaning and the answer to the question, “Can
machines think?” is to be sought in a statistical survey such as a Gallup poll.
But this is absurd. Instead of attempting such a definition I shall replace the
question by another, which is closely related to it and is expressed in
relatively unambiguous words.

The new form of the problem can be described in terms of a game which we call
the “imitation game.” It is played with three people, a man (A), a woman (B),
and an interrogator (C) who may be of either sex. The interrogator stays in a
room apart from the other two. The object of the game for the interrogator is to
determine which of the other two is the man and which is the woman. He knows
them by labels X and Y, and at the end of the game he says either “X is A and Y
is B” or “X is B and Y is A.” The interrogator is allowed to put questions to A
and B thus: C: Will X please tell me the length of his or her hair? Now suppose
X is actually A, then A must answer. It is A’s object in the game to try and
cause C to make the wrong identification. His answer might therefore be “My hair
is shingled, and the longest strands are about nine inches long.”

In order that tones of voice may not help the interrogator the answers should be
written, or better still, typewritten. The ideal arrangement is to have a
teleprinter communicating between the two rooms. Alternatively the question and
answers can be repeated by an intermediary. The object of the game for the third
player (B) is to help the interrogator. The best strategy for her is probably to
give truthful answers. She can add such things as “I am the woman, don’t listen
to him!” to her answers, but it will avail nothing as the man can make similar
remarks.

We now ask the question, “What will happen when a machine takes the part of A in
this game?” Will the interrogator decide wrongly as often when the game is
played like this as he does when the game is played between a man and a woman?
These questions replace our original, “Can machines think?”

2. Critique of the New Problem

As well as asking, “What is the answer to this new form of the question,” one
may ask, “Is this new question a worthy one to investigate?” This latter
question we investigate without further ado, thereby cutting short an infinite
regress.

The new problem has the advantage of drawing a fairly sharp line between the
physical and the intellectual capacities of a man. No engineer or chemist claims
to be able to produce a material which is indistinguishable from the human skin.
It is possible that at some time this might be done, but even supposing this
invention available we should feel there was little point in trying to make a
“thinking machine” more human by dressing it up in such artificial flesh. The
form in which we have set the problem reflects this fact in the condition which
prevents the interrogator from seeing or touching the other competitors, or
hearing their voices. Some other advantages of the proposed criterion may be
shown up by specimen questions and answers. Thus: Q: Please write me a sonnet on
the subject of the Forth Bridge. A: Count me out on this one. I never could
write poetry. Q: Add 34957 to 70764. A: (Pause about 30 seconds and then give as
answer) 105621. Q: Do you play chess? A: Yes. Q: I have K at my K1, and no other
pieces. You have only K at K6 and R at R1. It is your move. What do you play? A:
(After a pause of 15 seconds) R-R8 mate.

<script type="text/plain" id="rfc1-source">
Network Working Group                                   Steve Crocker
Request for Comments: 1                                          UCLA
                                                         7 April 1969


                         Title:   Host Software
                        Author:   Steve Crocker
                          Installation:   UCLA
                          Date:   7 April 1969
             Network Working Group Request for Comment:   1


Introduction

   The software for the ARPA Network exists partly in the IMPs and
   partly in the respective HOSTs.  BB&N has specified the software of
   the IMPs and it is the responsibility of the HOST groups to agree on
   HOST software.

   During the summer of 1968, representatives from the initial four
   sites met several times to discuss the HOST software and initial
   experiments on the network.  There emerged from these meetings a
   working group of three, Steve Carr from Utah, Jeff Rulifson from SRI,
   and Steve Crocker of UCLA, who met during the fall and winter.  The
   most recent meeting was in the last week of March in Utah.  Also
   present was Bill Duvall of SRI who has recently started working with
   Jeff Rulifson.

   Somewhat independently, Gerard DeLoche of UCLA has been working on
   the HOST-IMP interface.

   I present here some of the tentative agreements reached and some of
   the open questions encountered.  Very little of what is here is firm
   and reactions are expected.

I.   A Summary of the IMP Software

Messages

   Information is transmitted from HOST to HOST in bundles called
   messages.  A message is any stream of not more than 8080 bits,
   together with its header.  The header is 16 bits and contains the
   following information:

           Destination     5 bits
           Link            8 bits
           Trace           1 bit
           Spare           2 bits

   The destination is the numerical code for the HOST to which the
   message should be sent.  The trace bit signals the IMPs to record
   status information about the message and send the information back to
   the NMC (Network Measurement Center, i.e., UCLA).  The spare bits are
   unused.
